<!doctype html>
<html lang="en" class="dark antialiased vv-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080706" />
    <meta name="description" content="VoxVector is an advanced vocal deception analysis engine built around measurable evidence, reliability and disciplined interpretation." />
    <title>VoxVector | Advanced Vocal Deception Analysis</title>
    <link rel="stylesheet" href="/voxvector/brand.css?v=20260829-hero" />
    <link rel="stylesheet" href="/voxvector/landing.css?v=20260829-hero" />
    <link rel="stylesheet" href="/voxvector/visual-assets.css?v=20260829-hero" />
    <style>
      html.vv-booting,html.vv-booting body{background:#080706}html.vv-booting body{overflow:hidden}
      #vv-boot-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background:#080706;color:#fff;isolation:isolate;opacity:1;visibility:visible;transition:opacity 220ms ease,visibility 220ms ease}
      #vv-boot-loader.vv-boot-loader--hide{opacity:0;visibility:hidden;pointer-events:none}
      #vv-boot-loader .vv-boot-signals{position:absolute;inset:0;opacity:.56;pointer-events:none}#vv-boot-loader .vv-boot-signals svg{width:120%;height:100%;margin-left:-10%}
      #vv-boot-loader .vv-boot-signal{fill:none;stroke:url(#vv-boot-signal-gradient);stroke-linecap:round;vector-effect:non-scaling-stroke}.vv-boot-signal--primary{stroke-width:2.2;stroke-dasharray:18 12 70 20;filter:url(#vv-boot-soft-glow);animation:vv-boot-flow 5.5s linear infinite}.vv-boot-signal--secondary{stroke-width:1.25;opacity:.7;stroke-dasharray:10 22 44 16;animation:vv-boot-flow-reverse 7s linear infinite}
      #vv-boot-loader .vv-boot-grid path{fill:none;stroke:rgba(154,111,79,.055);stroke-width:1;stroke-dasharray:2 18;animation:vv-boot-grid 8s linear infinite}
      #vv-boot-loader .vv-boot-stage{position:relative;z-index:2;width:min(72vw,360px);display:grid;place-items:center}#vv-boot-loader .vv-boot-mark-wrap{position:relative;width:min(34vw,176px);aspect-ratio:1;display:grid;place-items:center}
      #vv-boot-loader .vv-boot-mark{position:relative;z-index:4;width:64%;height:64%;object-fit:contain;animation:vv-boot-mark 1.6s ease-in-out infinite}#vv-boot-loader .vv-boot-fallback{position:relative;z-index:4;display:grid;place-items:center;width:64%;height:64%;border:1px solid rgba(201,154,102,.5);color:#c99a66;font:800 30px/1 system-ui,sans-serif;letter-spacing:-.08em}
      #vv-boot-loader .vv-boot-pulse{position:absolute;z-index:2;width:68%;height:68%;border:1px solid rgba(154,111,79,.16);border-radius:50%;box-shadow:0 0 34px rgba(126,89,63,.08),inset 0 0 24px rgba(171,126,91,.035);animation:vv-boot-pulse 1.6s ease-in-out infinite}
      #vv-boot-loader .vv-boot-orbit{position:absolute;z-index:5;left:50%;top:50%;border:1.5px solid transparent;border-top-color:rgba(126,88,62,.92);border-right-color:rgba(102,72,54,.68);border-bottom-color:rgba(169,122,87,.30);border-radius:50%;pointer-events:none}.vv-boot-orbit--outer{width:102%;height:32%;transform:translate(-50%,-50%) rotate(-16deg);animation:vv-boot-orbit 2.6s linear infinite}.vv-boot-orbit--inner{width:84%;height:27%;transform:translate(-50%,-50%) rotate(24deg);opacity:.52;animation:vv-boot-orbit-reverse 3.4s linear infinite}
      #vv-boot-loader .vv-boot-label{margin-top:18px;color:rgba(201,154,102,.78);font:700 10px/1 system-ui,sans-serif;letter-spacing:.34em}
      #vv-boot-failure{position:fixed;inset:0;z-index:2147482999;display:grid;place-items:center;padding:32px;background:#080706;color:#f7f3ee;font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;opacity:0;visibility:hidden;transition:opacity 220ms ease,visibility 220ms ease}
      #vv-boot-failure.is-visible{opacity:1;visibility:visible}
      #vv-boot-failure .vv-boot-failure__panel{width:min(100%,620px);padding:32px;border:1px solid rgba(201,154,102,.28);background:#0f0d0b;box-shadow:0 30px 100px rgba(0,0,0,.45)}
      #vv-boot-failure .vv-boot-failure__eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;color:#c99a66}#vv-boot-failure h1{margin:12px 0 10px;font-size:clamp(2rem,6vw,3.5rem);line-height:1;letter-spacing:-.045em}#vv-boot-failure p{margin:0;color:rgba(247,243,238,.58);line-height:1.65}#vv-boot-failure button{margin-top:24px;border:1px solid rgba(201,154,102,.55);background:#c99a66;color:#090806;padding:12px 18px;font-weight:750;cursor:pointer}
      @keyframes vv-boot-mark{0%,100%{transform:scale(.97);opacity:.92}50%{transform:scale(1.035);opacity:1}}@keyframes vv-boot-pulse{0%,100%{transform:scale(.92);opacity:.35}50%{transform:scale(1.12);opacity:.72}}@keyframes vv-boot-orbit{from{transform:translate(-50%,-50%) rotate(-16deg) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(-16deg) rotate(360deg)}}@keyframes vv-boot-orbit-reverse{from{transform:translate(-50%,-50%) rotate(24deg) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(24deg) rotate(0deg)}}@keyframes vv-boot-flow{from{stroke-dashoffset:0;transform:translateX(-18px)}to{stroke-dashoffset:-220px;transform:translateX(18px)}}@keyframes vv-boot-flow-reverse{from{stroke-dashoffset:0;transform:translateX(20px)}to{stroke-dashoffset:260px;transform:translateX(-20px)}}@keyframes vv-boot-grid{from{stroke-dashoffset:0}to{stroke-dashoffset:-80px}}
      @media(max-width:640px){#vv-boot-loader .vv-boot-mark-wrap{width:min(42vw,158px)}#vv-boot-loader .vv-boot-signals{opacity:.48}}@media(prefers-reduced-motion:reduce){#vv-boot-loader *{animation-duration:1ms!important;animation-iteration-count:1!important}}

      /* Canonical Developer Console presentation: dark controls, clear state semantics, compact rhythm. */
      .vv-app .vv-main{padding:32px 34px 48px}
      .vv-app .vv-main .mb-5{margin-bottom:24px!important}
      .vv-app .vv-panel{padding:20px!important}
      .vv-app .vv-panel + .vv-panel{margin-top:14px}
      .vv-app .vv-metrics{gap:12px}
      .vv-app .vv-metrics>section{position:relative;min-height:126px;padding:18px!important;overflow:hidden}
      .vv-app .vv-metrics>section:before{content:'!';position:absolute;top:16px;right:16px;width:24px;height:24px;display:grid;place-items:center;border:1px solid rgba(239,68,68,.30);border-radius:50%;color:#ef4444;background:rgba(239,68,68,.08);font:800 12px/1 system-ui,sans-serif;opacity:.9}
      .vv-app .vv-metrics>section:has(.vv-dot.healthy):before{content:'✓';border-color:rgba(52,211,153,.30);color:#34d399;background:rgba(52,211,153,.08)}
      .vv-app .vv-metrics>section>div:first-child{padding-right:34px;letter-spacing:.13em}
      .vv-app .vv-metrics>section>div:nth-child(2){margin-top:12px!important;font-size:18px!important;letter-spacing:-.02em}
      .vv-app .vv-metrics>section>div:nth-child(3){max-width:88%;margin-top:6px!important;font-size:11px!important;line-height:1.45}
      .vv-app .vv-metrics>section:first-child>div:nth-child(2){font-size:17px!important}
      .vv-app .vv-metrics>section:first-child>div:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .vv-app .vv-dot{width:8px!important;height:8px!important;border-radius:50%!important;margin-top:14px!important}
      .vv-app .vv-dot.healthy{background:#34d399!important;box-shadow:0 0 0 0 rgba(52,211,153,.45);animation:vv-console-health-pulse 1.8s ease-out infinite}
      .vv-app .vv-dot.warning{background:#ef4444!important;box-shadow:0 0 0 0 rgba(239,68,68,.42);animation:vv-console-warning-pulse 1.6s ease-out infinite}
      @keyframes vv-console-health-pulse{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
      @keyframes vv-console-warning-pulse{70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
      .vv-app input.vv-input,.vv-app select.vv-input,.vv-app textarea.vv-input,.vv-app input[type='file'].vv-input{width:100%;min-height:44px;padding:10px 12px!important;border:1px solid rgba(255,255,255,.13)!important;border-radius:8px!important;background:#0a0a0a!important;color:#f5f5f5!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)!important;color-scheme:dark}
      .vv-app input.vv-input::placeholder,.vv-app textarea.vv-input::placeholder{color:rgba(245,245,245,.36)}
      .vv-app input.vv-input:focus,.vv-app select.vv-input:focus,.vv-app textarea.vv-input:focus{border-color:rgba(255,255,255,.34)!important;outline:2px solid rgba(255,255,255,.08)!important;outline-offset:0!important}
      .vv-app select.vv-input{appearance:none;-webkit-appearance:none;padding-right:38px!important;background-image:linear-gradient(45deg,transparent 50%,rgba(255,255,255,.65) 50%),linear-gradient(135deg,rgba(255,255,255,.65) 50%,transparent 50%)!important;background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px!important;background-size:5px 5px,5px 5px!important;background-repeat:no-repeat!important}
      .vv-app input[type='file'].vv-input{padding:7px!important;cursor:pointer}
      .vv-app input[type='file'].vv-input::file-selector-button{margin-right:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:6px;background:#171717;color:#f5f5f5;font-weight:650;cursor:pointer}
      .vv-app input[type='file'].vv-input:hover::file-selector-button{background:#202020;border-color:rgba(255,255,255,.28)}
      .vv-app input.vv-input:disabled,.vv-app select.vv-input:disabled{opacity:.48;cursor:not-allowed}
      .vv-app .vv-field-label{display:block;margin-bottom:8px;color:rgba(250,250,250,.72);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
      .vv-app .vv-panel .grid{row-gap:14px}
      .vv-app .vv-panel .flex.flex-wrap{row-gap:10px}
      .vv-app .vv-status-row{min-height:40px;padding:9px 11px;border:1px solid var(--vv-border);border-radius:7px;background:rgba(255,255,255,.018);color:var(--vv-muted-strong)}
      .vv-app .vv-status-row.error{border-color:rgba(239,68,68,.28);background:rgba(239,68,68,.06);color:#f28b8b}
      .vv-app .vv-copy{font-size:14px;line-height:1.65}
      .vv-app audio{width:100%;height:42px;border-radius:7px;background:#0a0a0a;color-scheme:dark}
      .vv-app .vv-data-grid{gap:10px!important;padding:12px;border:1px solid var(--vv-border);border-radius:8px;background:rgba(255,255,255,.014)}
      .vv-app .vv-upload-state{margin-top:12px}
      .vv-app .vv-upload-state,.vv-app .vv-file-info-panel,.vv-app .vv-analysis-state{border-radius:8px}
      .vv-app .vv-api-visualizer{padding:18px!important}
      .vv-app .vv-api-wave-stage{height:112px!important}
      .vv-app .vv-api-live{color:#34d399!important}
      @media(max-width:900px){
        .vv-app .vv-main{padding:24px 20px 40px}
        .vv-app .vv-metrics{gap:10px}
      }
      @media(max-width:620px){
        .vv-app .vv-main{padding:20px 14px 32px}
        .vv-app .vv-main .mb-5{margin-bottom:20px!important}
        .vv-app .vv-panel{padding:16px!important}
        .vv-app .vv-metrics{grid-template-columns:1fr!important}
        .vv-app .vv-metrics>section{min-height:112px}
        .vv-app .vv-panel .md\:grid-cols-\[1fr_auto\]{grid-template-columns:1fr!important}
        .vv-app .vv-panel .self-end{width:100%;justify-content:center}
        .vv-app .vv-panel .flex.flex-wrap>button{min-height:42px}
        .vv-app .vv-api-wave-stage{height:96px!important}
      }
      @media(prefers-reduced-motion:reduce){.vv-app .vv-dot.healthy,.vv-app .vv-dot.warning{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="vv-boot-loader" role="status" aria-live="polite" aria-label="Loading VoxVector">
      <div class="vv-boot-signals" aria-hidden="true"><svg viewBox="0 0 1200 700" preserveAspectRatio="none"><defs><linearGradient id="vv-boot-signal-gradient" x1="0" x2="1"><stop offset="0" stop-color="#5f4636" stop-opacity="0"/><stop offset=".48" stop-color="#a77b58" stop-opacity=".42"/><stop offset=".52" stop-color="#c99a72" stop-opacity=".58"/><stop offset="1" stop-color="#5f4636" stop-opacity="0"/></linearGradient><filter id="vv-boot-soft-glow"><feGaussianBlur stdDeviation="3"/></filter></defs><path class="vv-boot-signal vv-boot-signal--primary" d="M-40 360 C80 360 100 235 205 360 S340 485 455 360 S590 235 705 360 S840 485 955 360 S1090 235 1240 360"/><path class="vv-boot-signal vv-boot-signal--secondary" d="M-60 430 C55 430 105 330 195 430 S330 530 440 430 S575 330 690 430 S825 530 940 430 S1080 330 1260 430"/><g class="vv-boot-grid"><path d="M0 350 H1200"/><path d="M0 280 H1200"/><path d="M0 420 H1200"/></g></svg></div>
      <div class="vv-boot-stage"><div class="vv-boot-mark-wrap"><div class="vv-boot-orbit vv-boot-orbit--outer" aria-hidden="true"></div><div class="vv-boot-orbit vv-boot-orbit--inner" aria-hidden="true"></div><div class="vv-boot-pulse" aria-hidden="true"></div><img class="vv-boot-mark" src="/voxvector/voxvector-icon-final-color.png.PNG" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'vv-boot-fallback',textContent:'VV'}))"/></div><div class="vv-boot-label">VOXVECTOR</div></div>
    </div>
    <div id="vv-boot-failure" role="alert" aria-live="assertive">
      <div class="vv-boot-failure__panel">
        <div class="vv-boot-failure__eyebrow">VOXVECTOR</div>
        <h1>VoxVector could not initialize.</h1>
        <p>The application did not complete startup. Reload to try again.</p>
        <button type="button" onclick="window.location.reload()">Reload VoxVector</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function(){
        var loader=document.getElementById('vv-boot-loader');
        var failure=document.getElementById('vv-boot-failure');
        var ready=false;
        window.__voxvectorMarkReady=function(){
          if(ready)return;ready=true;document.documentElement.classList.remove('vv-booting');
          if(loader){loader.classList.add('vv-boot-loader--hide');window.setTimeout(function(){loader.remove()},260)}
          if(failure){failure.classList.remove('is-visible')}
        };
        window.__voxvectorBootFailed=function(){
          if(ready)return;document.documentElement.classList.remove('vv-booting');
          if(loader)loader.classList.add('vv-boot-loader--hide');
          if(failure)failure.classList.add('is-visible');
        };
        window.addEventListener('error',function(event){
          var target=event.target;
          var scriptError=target && target.tagName === 'SCRIPT';
          if(event.error || scriptError) window.setTimeout(window.__voxvectorBootFailed,0);
        });
        window.addEventListener('unhandledrejection',function(){window.setTimeout(window.__voxvectorBootFailed,0)});
        window.setTimeout(function(){if(!ready)window.__voxvectorBootFailed()},5000);
      }());
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
