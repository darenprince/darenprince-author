# VOXVECTOR PR BUILD PREVIEW
#
# GitHub's supported Pages workflow deliberately does not deploy a
# pull_request-triggered build. This workflow therefore builds the exact PR
# frontend and stores it as a downloadable artifact without touching the
# production Pages deployment.
#
# A public Pages preview will use a separate Pages repository/site so that a
# PR can never replace the production deployment.
name: VoxVector PR Preview Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: voxvector-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install VoxVector dependencies
        working-directory: voxvector
        run: npm install --no-audit --no-fund

      - name: Build isolated VoxVector preview
        working-directory: voxvector
        env:
          VITE_BASE_PATH: /voxvector-preview/pr-${{ github.event.pull_request.number }}/
          VITE_SUPABASE_URL: ${{ secrets.VOXVECTOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VOXVECTOR_SUPABASE_ANON_KEY }}
          VITE_VOXVECTOR_API_URL: https://voxvector.crownlabs.tech
        run: npm run build

      - name: Verify preview artifact
        working-directory: voxvector
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/voxvector-audio-analysis-console.png
          test -f dist/VoxVector-logo-word.png
          echo "VoxVector PR build completed and required assets are present."

      - name: Upload PR preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxvector-pr-preview-${{ github.event.pull_request.number }}
          path: voxvector/dist/
          if-no-files-found: error
          retention-days: 7
