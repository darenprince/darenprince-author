# CANONICAL PRODUCTION FRONTEND DEPLOYMENT
# VoxVector public frontend is deployed ONLY through GitHub Pages Actions.
# Vercel and Netlify are retired from the VoxVector frontend architecture.
# Backend API remains on Render at https://voxvector.crownlabs.tech.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build existing site
        run: npm run deploy:github-pages

      - name: Stage VoxVector public assets before Vite build
        run: |
          set -euo pipefail
          test -f VoxVector/voxvector-audio-analysis-console.png
          test -f VoxVector/Assets/VoxVector-logo-word.png
          mkdir -p voxvector/public
          cp VoxVector/voxvector-audio-analysis-console.png voxvector/public/voxvector-audio-analysis-console.png
          cp VoxVector/Assets/VoxVector-logo-word.png voxvector/public/VoxVector-logo-word.png
          test -f voxvector/public/voxvector-audio-analysis-console.png
          test -f voxvector/public/VoxVector-logo-word.png
          echo "Console image and header wordmark staged into the canonical Vite public directory."

      - name: Build VoxVector React application
        working-directory: voxvector
        env:
          VITE_SUPABASE_URL: ${{ secrets.VOXVECTOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VOXVECTOR_SUPABASE_ANON_KEY }}
          VITE_VOXVECTOR_API_URL: https://voxvector.crownlabs.tech
        run: npm install --no-audit --no-fund && npm run build

      - name: Verify VoxVector landing source and production build
        working-directory: voxvector
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/voxvector-audio-analysis-console.png
          test -f dist/VoxVector-logo-word.png
          grep -R -F -- "Deep Analysis Methods" src/components/LandingContentRefinement.jsx
          grep -R -F -- "See what really makes VoxVector the future of trusted vocal deception detection." src/components/LandingContentRefinement.jsx
          grep -R -F -- "State of the art Linguistics" src/components/LandingContentRefinement.jsx
          grep -R -F -- "2026-08-22-restored" src/components/LandingContentRefinement.jsx
          grep -R -F -- "VoxVector-logo-word.png" src/components/LandingContentRefinement.jsx
          grep -R -F -- "LandingContentRefinement" src/main.jsx
          grep -R -F -- "landing-runtime-recovery.css" src/main.jsx
          grep -R -F -- "voxvector-audio-analysis-console.png" dist/
          echo "Landing refinement source verified."
          echo "Runtime recovery styles verified."
          echo "Vite production build verified."
          echo "Console image and header wordmark verified inside Vite production output."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/voxvector
          rsync -a ./ _site/ \
            --exclude _site \
            --exclude .git \
            --exclude node_modules \
            --exclude voxvector/dist \
            --exclude 'VoxVector/**' \
            --exclude 'docs/**' \
            --exclude 'tests/**' \
            --exclude '*.log'
          rsync -a ./voxvector/dist/ _site/voxvector/
          mkdir -p _site/docs/crownlabsbible
          rsync -a ./docs/crownlabsbible/ _site/docs/crownlabsbible/
          mkdir -p _site/VoxVector/docs
          rsync -a ./VoxVector/docs/ _site/VoxVector/docs/
          mkdir -p _site/voxvector/developer
          cp ./voxvector/dist/index.html ./_site/voxvector/developer/index.html
          cp ./voxvector/dist/index.html ./_site/voxvector/404.html

      - name: Verify VoxVector Pages artifact
        run: |
          set -euo pipefail
          test -f _site/voxvector/index.html
          test -f _site/voxvector/developer/index.html
          test -f _site/voxvector/404.html
          test -f _site/voxvector/voxvector-audio-analysis-console.png
          test -f _site/voxvector/VoxVector-logo-word.png
          grep -R -F -- "Deep Analysis Methods" _site/voxvector/ 2>/dev/null
          grep -R -F -- "2026-08-22-restored" _site/voxvector/ 2>/dev/null
          echo "VoxVector production artifact verified."
          echo "VoxVector routes staged:"
          find _site/voxvector -maxdepth 2 -type f | sort | head -80
          echo "Crown Labs documentation routes staged:"
          find _site/docs/crownlabsbible/docs -maxdepth 1 -type f | sort | head -80
          echo "Local VoxVector technical docs mirrored for viewer:"
          find _site/VoxVector/docs -maxdepth 1 -type f | sort | head -80
          du -sh _site/voxvector _site/docs/crownlabsbible _site/VoxVector/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
