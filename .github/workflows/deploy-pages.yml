# CANONICAL PRODUCTION FRONTEND DEPLOYMENT
# VoxVector public frontend is deployed ONLY through GitHub Pages Actions.
# Vercel and Netlify are retired from the VoxVector frontend architecture.
# Backend API remains on Render at https://voxvector.crownlabs.tech.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build existing site
        run: npm run deploy:github-pages

      - name: Build VoxVector React application
        working-directory: voxvector
        env:
          VITE_SUPABASE_URL: ${{ secrets.VOXVECTOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VOXVECTOR_SUPABASE_ANON_KEY }}
          VITE_VOXVECTOR_API_URL: https://voxvector.crownlabs.tech
        run: npm install && npm run build

      - name: Verify VoxVector landing implementation in build
        working-directory: voxvector
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/voxvector-audio-analysis-console.png
          grep -R -F -- "Deep Analysis Methods" dist/
          grep -R -F -- "See what really makes VoxVector the future of trusted vocal deception detection." dist/
          grep -R -F -- "State of the art Linguistics" dist/
          grep -R -F -- "2026-08-21-v2" dist/
          if grep -R -F -- "Explore the evidence model" dist/; then
            echo "ERROR: obsolete workflow CTA survived the production build"
            exit 1
          fi
          if grep -R -F -- "VoxVector keeps reliability, evidence, candidate classification and final disposition separate" dist/; then
            echo "ERROR: obsolete workflow description survived the production build"
            exit 1
          fi
          echo "Landing implementation verified in production bundle."
          echo "Console image verified in production artifact."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/voxvector
          rsync -a ./ _site/ \
            --exclude _site \
            --exclude .git \
            --exclude node_modules \
            --exclude voxvector/dist \
            --exclude 'VoxVector/**' \
            --exclude 'docs/**' \
            --exclude 'tests/**' \
            --exclude '*.log'
          rsync -a ./voxvector/dist/ _site/voxvector/
          cp ./VoxVector/voxvector-audio-analysis-console.png ./_site/voxvector/voxvector-audio-analysis-console.png
          mkdir -p _site/docs/crownlabsbible
          rsync -a ./docs/crownlabsbible/ _site/docs/crownlabsbible/
          mkdir -p _site/VoxVector/docs
          rsync -a ./VoxVector/docs/ _site/VoxVector/docs/
          mkdir -p _site/voxvector/developer
          cp ./voxvector/dist/index.html ./_site/voxvector/developer/index.html
          cp ./voxvector/dist/index.html ./_site/voxvector/404.html

      - name: Verify VoxVector Pages artifact
        run: |
          set -euo pipefail
          test -f _site/voxvector/index.html
          test -f _site/voxvector/developer/index.html
          test -f _site/voxvector/404.html
          test -f _site/voxvector/voxvector-audio-analysis-console.png
          grep -R -F -- "Deep Analysis Methods" _site/voxvector/
          grep -R -F -- "See what really makes VoxVector the future of trusted vocal deception detection." _site/voxvector/
          grep -R -F -- "State of the art Linguistics" _site/voxvector/
          grep -R -F -- "2026-08-21-v2" _site/voxvector/
          if grep -R -F -- "Explore the evidence model" _site/voxvector/; then
            echo "ERROR: obsolete workflow CTA reached Pages artifact"
            exit 1
          fi
          if grep -R -F -- "VoxVector keeps reliability, evidence, candidate classification and final disposition separate" _site/voxvector/; then
            echo "ERROR: obsolete workflow description reached Pages artifact"
            exit 1
          fi
          test -f _site/docs/crownlabsbible/docs/index.html
          test -f _site/docs/crownlabsbible/docs/viewer.html
          test -f _site/VoxVector/docs/EXECUTIVE_SUMMARY.md
          test -f _site/VoxVector/docs/OPERATING_CHARTER.md
          echo "VoxVector landing content and asset verified in final Pages artifact."
          echo "VoxVector routes staged:"
          find _site/voxvector -maxdepth 2 -type f | sort | head -80
          echo "Crown Labs documentation routes staged:"
          find _site/docs/crownlabsbible/docs -maxdepth 1 -type f | sort | head -80
          echo "Local VoxVector technical docs mirrored for viewer:"
          find _site/VoxVector/docs -maxdepth 1 -type f | sort | head -80
          du -sh _site/voxvector _site/docs/crownlabsbible _site/VoxVector/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
