name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build existing site
        run: npm run deploy:github-pages

      - name: Build VoxVector React application
        working-directory: voxvector
        run: npm install && npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/voxvector
          rsync -a ./ _site/ \
            --exclude _site \
            --exclude .git \
            --exclude node_modules \
            --exclude voxvector/dist \
            --exclude 'VoxVector/**' \
            --exclude 'docs/**' \
            --exclude 'tests/**' \
            --exclude '*.log'
          rsync -a ./voxvector/dist/ _site/voxvector/

      - name: Report artifact size
        run: du -sh _site && du -sh _site/voxvector

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
