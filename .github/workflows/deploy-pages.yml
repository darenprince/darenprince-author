# CANONICAL PRODUCTION FRONTEND DEPLOYMENT
# VoxVector public frontend is deployed ONLY through GitHub Pages Actions.
# Production deployment is sourced from main only.
# Vercel and Netlify are retired from the VoxVector frontend architecture.
# Backend API remains on Render at https://voxvector.crownlabs.tech.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build existing site
        run: npm run deploy:github-pages

      - name: Regenerate VoxVector lockfile
        working-directory: voxvector
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Persist VoxVector lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- voxvector/package-lock.json; then
            echo "VoxVector package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voxvector/package-lock.json
          git commit -m "chore(voxvector): regenerate package-lock.json"
          git push

      # Canonical source assets live only under VoxVector/Assets.
      # They are staged into the React public directory before Vite builds.
      # Keep these paths case-sensitive and do not introduce permanent copies
      # under VoxVector/ or another competing asset directory.
      - name: Stage VoxVector canonical public assets
        run: |
          set -euo pipefail
          CONSOLE_SOURCE="VoxVector/Assets/voxvector-audio-analysis-console.png"
          WORDMARK_SOURCE="VoxVector/Assets/VoxVector-logo-word.png"
          ICON_SOURCE="VoxVector/Assets/voxvector-icon-final-color.png.PNG"

          test -f "$CONSOLE_SOURCE"
          test -f "$WORDMARK_SOURCE"
          test -f "$ICON_SOURCE"

          # Fail loudly if an obsolete permanent source copy is reintroduced.
          if test -e "VoxVector/voxvector-audio-analysis-console.png"; then
            echo "ERROR: obsolete duplicate console asset path exists: VoxVector/voxvector-audio-analysis-console.png"
            echo "Use the canonical source: $CONSOLE_SOURCE"
            exit 1
          fi
          if test -e "VoxVector/VoxVector-logo-word.png"; then
            echo "ERROR: obsolete duplicate wordmark path exists: VoxVector/VoxVector-logo-word.png"
            echo "Use the canonical source: $WORDMARK_SOURCE"
            exit 1
          fi

          mkdir -p voxvector/public
          cp "$CONSOLE_SOURCE" voxvector/public/voxvector-audio-analysis-console.png
          cp "$WORDMARK_SOURCE" voxvector/public/VoxVector-logo-word.png
          cp "$ICON_SOURCE" voxvector/public/voxvector-icon-final-color.png.PNG
          test -f voxvector/public/voxvector-audio-analysis-console.png
          test -f voxvector/public/VoxVector-logo-word.png
          test -f voxvector/public/voxvector-icon-final-color.png.PNG
          echo "Canonical VoxVector image assets staged before Vite build."

      - name: Build VoxVector React application
        working-directory: voxvector
        env:
          VITE_SUPABASE_URL: ${{ secrets.VOXVECTOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VOXVECTOR_SUPABASE_ANON_KEY }}
          VITE_VOXVECTOR_API_URL: https://voxvector.crownlabs.tech
        run: npm install --no-audit --no-fund && npm run build

      - name: Verify VoxVector production build
        working-directory: voxvector
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/voxvector-audio-analysis-console.png
          test -f dist/VoxVector-logo-word.png
          test -f dist/voxvector-icon-final-color.png.PNG
          echo "VoxVector production build and required public assets verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/voxvector
          rsync -a ./ _site/ \
            --exclude _site \
            --exclude .git \
            --exclude node_modules \
            --exclude voxvector/dist \
            --exclude 'VoxVector/**' \
            --exclude 'docs/**' \
            --exclude 'tests/**' \
            --exclude '*.log'
          rsync -a ./voxvector/dist/ _site/voxvector/
          mkdir -p _site/docs/crownlabsbible
          rsync -a ./docs/crownlabsbible/ _site/docs/crownlabsbible/
          mkdir -p _site/VoxVector/docs
          rsync -a ./VoxVector/docs/ _site/VoxVector/docs/
          mkdir -p _site/voxvector/developer
          cp ./voxvector/dist/index.html ./_site/voxvector/developer/index.html
          cp ./voxvector/dist/index.html ./_site/voxvector/404.html

      - name: Verify VoxVector Pages artifact
        run: |
          set -euo pipefail
          test -f _site/voxvector/index.html
          test -f _site/voxvector/developer/index.html
          test -f _site/voxvector/404.html
          test -f _site/voxvector/voxvector-audio-analysis-console.png
          test -f _site/voxvector/VoxVector-logo-word.png
          test -f _site/voxvector/voxvector-icon-final-color.png.PNG
          echo "VoxVector production Pages artifact verified."
          echo "VoxVector routes staged:"
          find _site/voxvector -maxdepth 2 -type f | sort | head -80
          echo "Crown Labs documentation routes staged:"
          find _site/docs/crownlabsbible/docs -maxdepth 1 -type f | sort | head -80
          echo "Local VoxVector technical docs mirrored for viewer:"
          find _site/VoxVector/docs -maxdepth 1 -type f | sort | head -80
          du -sh _site/voxvector _site/docs/crownlabsbible _site/VoxVector/docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
