# CANONICAL PRODUCTION FRONTEND DEPLOYMENT
# Production deployment is sourced from main only.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    # Pages owns the public author site and published documentation.
    paths:
      - '**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-production
  # Do not cancel an in-flight production publish when documentation or other rapid main commits follow.
  # Let the active publish finish, then run the newest queued revision.
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build existing site
        run: npm run deploy:github-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # The root site Vite configuration intentionally emits its production
          # files in-place (outDir: ".") for the existing NexusWho entrypoint.
          # Stage the published runtime surface explicitly instead of assuming ./dist.
          rsync -a ./ _site/ \
            --exclude '_site/**' \
            --exclude '.git/**' \
            --exclude 'node_modules/**' \
            --exclude 'docs/**' \
            --exclude 'src/**' \
            --exclude 'scripts/**' \
            --exclude 'tests/**' \
            --exclude '.github/**' \
            --exclude '*.log' \
            --exclude 'package*.json' \
            --exclude 'vite.config.*' \
            --exclude 'tsconfig*.json'
          mkdir -p _site/docs/crownlabsbible
          rsync -a ./docs/crownlabsbible/ _site/docs/crownlabsbible/

      - name: Report staged Pages artifact
        run: |
          set -euo pipefail
          echo "Pages artifact staged successfully."
          du -sh _site || true
          find _site -maxdepth 2 -type f | sort | head -80 || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
