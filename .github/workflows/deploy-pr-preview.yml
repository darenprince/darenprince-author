# VOXVECTOR PR PREVIEW BUILD
#
# This workflow builds the exact PR frontend for review but does not deploy it
# to the production Pages environment. GitHub's supported Pages workflow
# intentionally skips deployment for pull_request events.
#
# A public browser preview will be deployed later from an isolated Pages
# preview repository/site. Until then the PR artifact is the review boundary.
name: VoxVector PR Preview Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: voxvector-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage VoxVector canonical public assets
        run: |
          set -euo pipefail
          CONSOLE_SOURCE="VoxVector/Assets/voxvector-audio-analysis-console.png"
          WORDMARK_SOURCE="VoxVector/Assets/VoxVector-logo-word.png"
          ICON_SOURCE="VoxVector/Assets/voxvector-icon-final-color.png.PNG"

          test -f "$CONSOLE_SOURCE"
          test -f "$WORDMARK_SOURCE"
          test -f "$ICON_SOURCE"

          if test -e "VoxVector/voxvector-audio-analysis-console.png"; then
            echo "ERROR: obsolete duplicate console asset path exists: VoxVector/voxvector-audio-analysis-console.png"
            echo "Use the canonical source: $CONSOLE_SOURCE"
            exit 1
          fi
          if test -e "VoxVector/VoxVector-logo-word.png"; then
            echo "ERROR: obsolete duplicate wordmark asset path exists: VoxVector/VoxVector-logo-word.png"
            echo "Use the canonical source: $WORDMARK_SOURCE"
            exit 1
          fi

          mkdir -p voxvector/public
          cp "$CONSOLE_SOURCE" voxvector/public/voxvector-audio-analysis-console.png
          cp "$WORDMARK_SOURCE" voxvector/public/VoxVector-logo-word.png
          cp "$ICON_SOURCE" voxvector/public/voxvector-icon-final-color.png.PNG
          test -f voxvector/public/voxvector-audio-analysis-console.png
          test -f voxvector/public/VoxVector-logo-word.png
          test -f voxvector/public/voxvector-icon-final-color.png.PNG
          echo "Canonical VoxVector preview assets staged before Vite build."

      - name: Install VoxVector dependencies
        working-directory: voxvector
        run: npm install --no-audit --no-fund

      - name: Build VoxVector preview
        working-directory: voxvector
        env:
          VITE_BASE_PATH: /voxvector-preview/pr-${{ github.event.pull_request.number }}/
          VITE_SUPABASE_URL: ${{ secrets.VOXVECTOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VOXVECTOR_SUPABASE_ANON_KEY }}
          VITE_VOXVECTOR_API_URL: https://voxvector.crownlabs.tech
        run: npm run build

      - name: Verify preview artifact
        working-directory: voxvector
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/voxvector-audio-analysis-console.png
          test -f dist/VoxVector-logo-word.png
          test -f dist/voxvector-icon-final-color.png.PNG
          echo "VoxVector PR preview build completed and required assets are present."

      - name: Upload PR preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxvector-pr-preview-${{ github.event.pull_request.number }}
          path: voxvector/dist/
          if-no-files-found: error
          retention-days: 7
