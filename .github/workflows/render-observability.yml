name: Render Observability

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Optional Render service ID override; repository RENDER_SERVICE_ID is used by default'
        required: false
        type: string
      log_minutes:
        description: 'Minutes of recent logs to inspect'
        required: false
        default: '180'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-observability.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      LOG_MINUTES: ${{ inputs.log_minutes }}
    steps:
      - name: Resolve and validate Render configuration
        env:
          SERVICE_OVERRIDE: ${{ inputs.service_id }}
        run: |
          test -n "$RENDER_API_KEY" || { echo 'RENDER_API_KEY repository secret is not configured.' >&2; exit 1; }
          if [ -n "$SERVICE_OVERRIDE" ]; then RENDER_SERVICE_ID="$SERVICE_OVERRIDE"; fi
          test -n "$RENDER_SERVICE_ID" || { echo 'RENDER_SERVICE_ID repository secret is not configured, and no workflow override was supplied.' >&2; exit 1; }
          LOG_MINUTES="${LOG_MINUTES:-180}"
          echo "RENDER_SERVICE_ID=$RENDER_SERVICE_ID" >> "$GITHUB_ENV"
          echo "LOG_MINUTES=$LOG_MINUTES" >> "$GITHUB_ENV"
          echo "Selected Render service: $RENDER_SERVICE_ID"
          echo "Log lookback: ${LOG_MINUTES} minutes"
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/render" --version
      - name: Resolve Render workspace
        run: |
          render workspaces -o json > render-workspaces.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('render-workspaces.json').read_text())
          rows=data if isinstance(data,list) else data.get('workspaces') or data.get('data') or []
          if len(rows) != 1:
              names=[{'id':x.get('id'),'name':x.get('name')} for x in rows]
              raise SystemExit(f'Expected exactly one workspace for this automation key; found: {names}')
          workspace=rows[0]
          workspace_id=workspace.get('id') or workspace.get('name')
          if not workspace_id:
              raise SystemExit('Workspace record did not contain an id or name')
          Path('render-workspace-id.txt').write_text(str(workspace_id))
          PY
          render workspace set "$(cat render-workspace-id.txt)"
          render workspace current
      - name: Inspect Render service and deployments
        run: |
          render services -o json > render-services.json
          render deploys list "$RENDER_SERVICE_ID" -o json > render-deploys.json
      - name: Inspect recent logs
        run: |
          START_TIME="$(date -u -d "${LOG_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%SZ)"
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Querying Render logs from $START_TIME through $END_TIME"
          render logs --resources "$RENDER_SERVICE_ID" --start "$START_TIME" --end "$END_TIME" --limit 1000 --output json > render-logs.json
      - name: Select target service from workspace inventory
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          services=json.loads(Path('render-services.json').read_text())
          service_id=os.environ['RENDER_SERVICE_ID']
          rows=services if isinstance(services,list) else services.get('services') or services.get('data') or []
          target=next((item for item in rows if item.get('id') == service_id), {})
          Path('render-service.json').write_text(json.dumps(target, indent=2))
          print('target_found=', bool(target))
          PY
      - name: Summarize VoxVector runtime evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load_json_values(path):
              text=Path(path).read_text().strip()
              if not text:
                  return []
              decoder=json.JSONDecoder()
              values=[]
              index=0
              while index < len(text):
                  while index < len(text) and text[index].isspace():
                      index += 1
                  if index >= len(text):
                      break
                  value, next_index=decoder.raw_decode(text, index)
                  values.append(value)
                  index=next_index
              return values

          def rows_from(values, keys=()):
              rows=[]
              for value in values:
                  if isinstance(value, list):
                      rows.extend(value)
                  elif isinstance(value, dict):
                      found=None
                      for key in keys:
                          if isinstance(value.get(key), list):
                              found=value[key]
                              break
                      rows.extend(found if found is not None else [value])
              return rows

          def message_from(item):
              if not isinstance(item, dict):
                  return str(item)
              return str(item.get('message') or item.get('text') or item.get('msg') or '')

          services=rows_from(load_json_values('render-services.json'), ('services','data'))
          deploys=rows_from(load_json_values('render-deploys.json'), ('deploys','data'))
          logs=rows_from(load_json_values('render-logs.json'), ('logs','data'))

          print('VOXVECTOR_RENDER_OBSERVABILITY')
          print('service_inventory_count=', len(services))
          print('target_service_id=', os.environ['RENDER_SERVICE_ID'])
          latest=deploys[0] if deploys else {}
          if isinstance(latest, dict):
              print('latest_deploy_id=', latest.get('id','unknown'))
              print('latest_deploy_status=', latest.get('status','unknown'))
          print('log_count=', len(logs))

          needles=('memory limit','out of memory','oom','killed','restart','error','critical','exception','VOXVECTOR_')
          matches=[]
          for item in logs:
              text=message_from(item)
              if any(n in text.lower() for n in needles):
                  matches.append(text)
          print('incident_signal_count=', len(matches))
          for text in matches[-100:]:
              print(text)
          PY
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-observability-${{ github.run_id }}
          path: |
            render-workspaces.json
            render-workspace-id.txt
            render-services.json
            render-service.json
            render-deploys.json
            render-logs.json
          retention-days: 7
