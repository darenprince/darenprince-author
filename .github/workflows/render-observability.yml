name: Render Observability

on:
  push:
    branches:
      - feat/voxvector-render-diagnostic
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Optional Render service ID override; repository RENDER_SERVICE_ID is used by default'
        required: false
        type: string
      log_minutes:
        description: 'Minutes of recent logs to inspect'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      LOG_MINUTES: ${{ inputs.log_minutes || '120' }}
    steps:
      - name: Resolve and validate Render configuration
        env:
          SERVICE_OVERRIDE: ${{ inputs.service_id }}
        run: |
          test -n "$RENDER_API_KEY" || { echo 'RENDER_API_KEY repository secret is not configured.' >&2; exit 1; }
          if [ -n "$SERVICE_OVERRIDE" ]; then RENDER_SERVICE_ID="$SERVICE_OVERRIDE"; fi
          test -n "$RENDER_SERVICE_ID" || { echo 'RENDER_SERVICE_ID repository secret is not configured, and no workflow override was supplied.' >&2; exit 1; }
          echo "RENDER_SERVICE_ID=$RENDER_SERVICE_ID" >> "$GITHUB_ENV"
          echo "Selected Render service: $RENDER_SERVICE_ID"
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/render-cli/main/bin/install.sh | bash
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"
      - name: Inspect Render service and deployments
        run: |
          render services -o json > render-services.json
          render deploys list "$RENDER_SERVICE_ID" -o json > render-deploys.json
      - name: Inspect recent logs
        run: |
          render logs "$RENDER_SERVICE_ID" --since "${LOG_MINUTES}m" --limit 500 -o json > render-logs.json
      - name: Select target service from workspace inventory
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          services=json.loads(Path('render-services.json').read_text())
          service_id=os.environ['RENDER_SERVICE_ID']
          rows=services if isinstance(services,list) else services.get('services') or services.get('data') or []
          target=next((item for item in rows if item.get('id') == service_id), {})
          Path('render-service.json').write_text(json.dumps(target, indent=2))
          print('target_found=', bool(target))
          PY
      - name: Summarize VoxVector runtime evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          service=json.loads(Path('render-service.json').read_text())
          deploys=json.loads(Path('render-deploys.json').read_text())
          logs=json.loads(Path('render-logs.json').read_text())
          def get(obj, *keys, default=None):
              cur=obj
              for key in keys:
                  if isinstance(cur, dict): cur=cur.get(key)
                  elif isinstance(cur, list) and isinstance(key,int) and key < len(cur): cur=cur[key]
                  else: return default
              return cur if cur is not None else default
          print('VOXVECTOR_RENDER_OBSERVABILITY')
          print('service_id=', get(service,'id',default='unknown'))
          print('service_name=', get(service,'name',default='unknown'))
          print('service_suspended=', get(service,'suspended',default='unknown'))
          deploy_rows=deploys.get('deploys') or deploys.get('data') or [] if isinstance(deploys,dict) else deploys
          latest=deploy_rows[0] if deploy_rows else {}
          print('latest_deploy_id=', get(latest,'id',default='unknown'))
          print('latest_deploy_status=', get(latest,'status',default='unknown'))
          log_rows=logs.get('logs',[]) if isinstance(logs,dict) else logs
          print('log_count=', len(log_rows) if isinstance(log_rows,list) else 0)
          if isinstance(log_rows,list):
              for item in log_rows[-100:]:
                  text=get(item,'message',default=get(item,'text',default=''))
                  if 'VOXVECTOR_' in str(text) or 'error' in str(text).lower() or 'critical' in str(text).lower() or 'memory' in str(text).lower() or 'oom' in str(text).lower(): print(text)
          PY
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-observability-${{ github.run_id }}
          path: |
            render-services.json
            render-service.json
            render-deploys.json
            render-logs.json
          retention-days: 7
