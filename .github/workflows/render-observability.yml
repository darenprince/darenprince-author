name: Render Observability

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Render service ID to inspect'
        required: true
        type: string
      log_minutes:
        description: 'Minutes of recent logs to inspect'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ inputs.service_id }}
      LOG_MINUTES: ${{ inputs.log_minutes }}
    steps:
      - name: Validate Render secret
        run: |
          test -n "$RENDER_API_KEY" || {
            echo 'RENDER_API_KEY repository secret is not configured.' >&2
            exit 1
          }
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/render-cli/main/bin/install.sh | bash
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"
      - name: Inspect Render service and deployments
        run: |
          render services -o json > render-services.json
          render deploys list "$RENDER_SERVICE_ID" -o json > render-deploys.json
      - name: Inspect recent logs
        run: |
          render logs "$RENDER_SERVICE_ID" --since "${LOG_MINUTES}m" --limit 500 -o json > render-logs.json
      - name: Select target service from workspace inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          services=json.loads(Path('render-services.json').read_text())
          target=next((item for item in services if item.get('id') == '${{ inputs.service_id }}'), None) if isinstance(services,list) else None
          if target is None and isinstance(services,dict):
              target=services.get('service') or services.get('services')
          Path('render-service.json').write_text(json.dumps(target or {}, indent=2))
          print('target_found=', bool(target))
          PY
      - name: Summarize VoxVector runtime evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          service=json.loads(Path('render-service.json').read_text())
          deploys=json.loads(Path('render-deploys.json').read_text())
          logs=json.loads(Path('render-logs.json').read_text())
          def get(obj, *keys, default=None):
              cur=obj
              for key in keys:
                  if isinstance(cur, dict): cur=cur.get(key)
                  elif isinstance(cur, list) and isinstance(key,int) and key < len(cur): cur=cur[key]
                  else: return default
              return cur if cur is not None else default
          print('VOXVECTOR_RENDER_OBSERVABILITY')
          print('service_id=', get(service,'id',default='unknown'))
          print('service_name=', get(service,'name',default='unknown'))
          print('service_suspended=', get(service,'suspended',default='unknown'))
          if isinstance(deploys,dict):
              deploy_rows=deploys.get('deploys') or deploys.get('data') or []
          else:
              deploy_rows=deploys
          latest=deploy_rows[0] if deploy_rows else {}
          print('latest_deploy_id=', get(latest,'id',default='unknown'))
          print('latest_deploy_status=', get(latest,'status',default='unknown'))
          log_rows=logs.get('logs',[]) if isinstance(logs,dict) else logs
          print('log_count=', len(log_rows) if isinstance(log_rows,list) else 0)
          if isinstance(log_rows,list):
              for item in log_rows[-50:]:
                  text=get(item,'message',default=get(item,'text',default=''))
                  if 'VOXVECTOR_' in str(text) or 'error' in str(text).lower() or 'critical' in str(text).lower():
                      print(text)
          PY
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-observability-${{ github.run_id }}
          path: |
            render-services.json
            render-service.json
            render-deploys.json
            render-logs.json
          retention-days: 7
