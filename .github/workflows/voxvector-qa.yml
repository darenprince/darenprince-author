name: VoxVector QA

on:
  push:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'
  pull_request:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoxVector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voxvector/package-lock.json
      - name: Install API package
        run: python -m pip install -e '.[dev]'
      - name: Run VoxVector API tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Record tested source revision
        run: |
          echo "VOXVECTOR_QA_SOURCE_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "VoxVector QA passed for $GITHUB_SHA"
      - name: Install React application dependencies
        working-directory: voxvector
        run: npm install
      - name: Build React application
        working-directory: voxvector
        run: npm run build
