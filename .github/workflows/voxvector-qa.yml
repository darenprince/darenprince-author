name: VoxVector QA

on:
  push:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'
  pull_request:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoxVector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voxvector/package.json
      - name: Install API package
        run: python -m pip install -e '.[dev]'
      - name: Run VoxVector API tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Install React application dependencies
        working-directory: voxvector
        run: npm install
      - name: Repair App.jsx parser syntax
        working-directory: voxvector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = "Know when the evidence isn't enough"
          new = "Know when the evidence isn\\'t enough"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          if ! git diff --quiet -- src/App.jsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/App.jsx
            git commit -m 'fix(voxvector): escape evidence list apostrophe'
            git push
          fi
      - name: Build React application
        working-directory: voxvector
        run: npm run build
