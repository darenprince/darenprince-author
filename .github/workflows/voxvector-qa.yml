name: VoxVector QA

on:
  push:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'
  pull_request:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoxVector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voxvector/package.json
      - name: Install API package
        run: python -m pip install -e '.[dev]'
      - name: Run VoxVector API tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Install React application dependencies
        working-directory: voxvector
        run: npm install
      - name: Repair VoxVector frontend compatibility
        working-directory: voxvector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text().replace("Know when the evidence isn't enough", "Know when the evidence isn\\'t enough").replace('Github, ', '').replace('<Github', '<Code2'); p.write_text(s)
          p=Path('src/components/LandingChrome.jsx'); s=p.read_text()
          for a,b in [('Github, ',''),('Instagram, ',''),('Linkedin, ',''),('Youtube, ',''),('Twitter }','}'),('<Github','<Code2'),('<Instagram','<Share2'),('<Youtube','<Play'),('<Linkedin','<UserRound'),('<Twitter','<X')]: s=s.replace(a,b,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- src/App.jsx src/components/LandingChrome.jsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/App.jsx src/components/LandingChrome.jsx
            git commit -m 'fix frontend icons'
            git push
          fi
      - name: Build React application
        working-directory: voxvector
        run: npm run build
