name: VoxVector QA

on:
  push:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'
  pull_request:
    paths:
      - 'VoxVector/**'
      - 'voxvector/**'
      - '.github/workflows/voxvector-qa.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoxVector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voxvector/package.json
      - name: Install API package
        run: python -m pip install -e '.[dev]'
      - name: Run VoxVector API tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Install React application dependencies
        working-directory: voxvector
        run: npm install
      - name: Inspect App.jsx parser region
        working-directory: voxvector
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/App.jsx').read_text()
          for position in (24836, 24851, 24899, 25056, 25071, 25119):
              start = max(0, position - 220)
              end = min(len(source), position + 220)
              print(f'--- source offset {position} ---')
              print(source[start:end])
          PY
      - name: Build React application
        working-directory: voxvector
        run: npm run build
