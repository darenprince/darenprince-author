<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxVector Developer Console</title>
<style>
:root{color-scheme:dark;--bg:#080a0d;--panel:#101318;--panel2:#151922;--line:#272d38;--text:#f4f6f8;--muted:#9aa3af;--accent:#e7e9ed;--danger:#ff6b6b;--warn:#f3c969;--ok:#67d69b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#1a1e26 0,transparent 45%)}.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);padding:34px}.brand{display:flex;gap:14px;align-items:center;margin-bottom:28px}.mark{width:42px;height:42px;border:1px solid #555d69;display:grid;place-items:center;font-weight:800;font-size:20px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}.login h1{font-size:27px;margin:4px 0}.field{margin:16px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input{width:100%;background:#0b0e12;border:1px solid var(--line);color:var(--text);padding:12px 13px;outline:none}.field input:focus{border-color:#737b88}.primary{width:100%;padding:12px;border:0;background:#f1f2f4;color:#080a0d;font-weight:750;cursor:pointer}.error{color:var(--danger);font-size:12px;margin-top:12px}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid var(--line);background:#0b0e12;padding:22px 14px;display:flex;flex-direction:column}.side-brand{padding:6px 10px 22px;border-bottom:1px solid var(--line);margin-bottom:14px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.user{padding:10px 12px;color:var(--muted);font-size:12px;overflow:hidden}.logout{width:100%;padding:10px 12px;background:transparent;color:var(--text);border:1px solid var(--line);cursor:pointer}.main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top h2{font-size:18px;margin:0}.content{padding:30px;max-width:1500px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;min-width:0}.metric{font-size:29px;font-weight:750;margin-top:8px}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h3{margin:0;font-size:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);font-size:11px}.badge.danger{color:var(--danger);border-color:#61343a}.badge.warn{color:var(--warn)}.badge.ok{color:var(--ok)}.split{display:grid;grid-template-columns:300px 1fr;gap:14px}.list{max-height:620px;overflow:auto}.list button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left;padding:12px;cursor:pointer}.list button:hover{background:var(--panel2)}pre{white-space:pre-wrap;word-break:break-word;background:#090b0f;border:1px solid var(--line);padding:16px;max-height:650px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.refresh{border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 11px;cursor:pointer}.notice{border-left:3px solid var(--warn);background:#14120d;padding:13px 15px;color:#d8d0b6;margin-bottom:16px}.danger-card{border-color:#5d3035}.api-row{display:flex;gap:10px;align-items:center}.method{width:58px;font-size:11px;font-weight:800}.method.GET{color:var(--ok)}.method.POST{color:#8fc7ff}.method.PATCH{color:var(--warn)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:10px;display:block}.side-brand,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.top{padding:0 18px}.content{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{height:60px}}
</style>
</head>
<body>
<div id="login" class="login">
  <form class="login-card" id="loginForm">
    <div class="brand"><div class="mark">V</div><div><div class="eyebrow">VoxVector</div><strong>Developer Console</strong></div></div>
    <h1>Restricted access</h1><p class="muted">Authenticate with an authorized VoxVector developer account.</p>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="primary">Sign in</button><div id="loginError" class="error"></div>
  </form>
</div>
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="side-brand"><div class="eyebrow">VoxVector</div><strong>Developer Console</strong></div>
    <nav class="nav">
      <button data-page="dashboard" class="active">Overview</button>
      <button data-page="api">API Interface</button>
      <button data-page="errors">Error Reports</button>
      <button data-page="logs">Diagnostic Logs</button>
      <button data-page="docs">Documentation</button>
      <button data-page="roadmap">Next Phase</button>
    </nav>
    <div class="side-bottom"><div id="user" class="user"></div><button id="logout" class="logout">Log out</button></div>
  </aside>
  <main class="main"><header class="top"><h2 id="title">Overview</h2><button class="refresh" id="refresh">Refresh</button></header><div class="content" id="content"></div></main>
</div>
<script>
const state={token:sessionStorage.getItem('vv_token'),user:null,role:null};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'}});if(r.status===401||r.status===403){logout();throw new Error('Session expired or access revoked');}if(!r.ok){throw new Error((await r.text()).slice(0,400));}return r.json();}
function logout(){sessionStorage.removeItem('vv_token');state.token=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden');}
async function boot(){if(!state.token)return;try{const s=await api('/developer/api/session');state.user=s.user;state.role=s.role;$('#user').textContent=`${s.user.email||s.user.id} · ${s.role}`;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render('dashboard');}catch(e){logout();}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{const s=await fetch('/developer/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const data=await s.json();if(!s.ok)throw new Error(data.detail||'Authentication failed');state.token=data.access_token;sessionStorage.setItem('vv_token',state.token);state.user=data.user;state.role=data.role;await boot();}catch(err){$('#loginError').textContent=err.message;}});
$('#logout').onclick=logout; $('#refresh').onclick=()=>render(current); let current='dashboard';
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.page)});
function layout(title,body){$('#title').textContent=title;$('#content').innerHTML=body}
async function render(page){current=page;try{if(page==='dashboard')return dashboard();if(page==='api')return apiPage();if(page==='errors')return errorsPage();if(page==='logs')return logsPage();if(page==='docs')return docsPage();if(page==='roadmap')return roadmapPage();}catch(e){layout('Console error',`<div class="card danger-card"><h3>Request failed</h3><p>${esc(e.message)}</p></div>`)}}
async function dashboard(){const d=await api('/developer/api/overview');const errors=d.errors||[],open=errors.filter(x=>x.status!=='resolved').length,critical=errors.filter(x=>['critical','high'].includes(x.severity)).length;layout('Overview',`<div class="notice"><strong>Operational console.</strong> This surface exposes diagnostics and engineering state only. It does not turn observational analysis into validated deception inference.</div><div class="grid"><div class="card"><div class="muted">Open errors</div><div class="metric">${open}</div></div><div class="card"><div class="muted">High / critical</div><div class="metric">${critical}</div></div><div class="card"><div class="muted">Roadmap items</div><div class="metric">${(d.roadmap||[]).length}</div></div><div class="card"><div class="muted">Diagnostic bucket</div><div class="metric" style="font-size:17px">${esc(d.storage_bucket)}</div></div></div><div class="section"><div class="section-head"><h3>Recent errors</h3><button class="refresh" onclick="render('errors')">Open reports</button></div><div class="card">${errorTable(errors.slice(0,8))}</div></div><div class="section"><div class="section-head"><h3>Next phase</h3><button class="refresh" onclick="render('roadmap')">Open roadmap</button></div><div class="card">${roadmapTable((d.roadmap||[]).slice(0,8))}</div></div>`)}
function errorTable(rows){if(!rows.length)return '<div class="empty">No persisted error reports.</div>';return `<table class="table"><thead><tr><th>Severity</th><th>Status</th><th>Service / route</th><th>Message</th><th>Occurred</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="badge ${x.severity==='critical'||x.severity==='high'?'danger':''}">${esc(x.severity)}</span></td><td>${esc(x.status)}</td><td>${esc(x.service)}<br><span class="muted">${esc(x.method)} ${esc(x.route)}</span></td><td>${esc(x.message)}</td><td>${esc(x.occurred_at)}</td></tr>`).join('')}</tbody></table>`}
async function errorsPage(){const rows=await api('/developer/api/errors');layout('Error Reports',`<div class="section"><div class="card">${errorTable(rows)} </div></div>`)}
async function apiPage(){const rows=await api('/developer/api/endpoints');layout('API Interface',`<div class="card"><p class="muted">Live route inventory from the running FastAPI application.</p><table class="table"><thead><tr><th>Method</th><th>Endpoint</th><th>Handler</th></tr></thead><tbody>${rows.map(x=>x.methods.map(m=>`<tr><td><span class="method ${m}">${m}</span></td><td><code>${esc(x.path)}</code></td><td>${esc(x.name)}</td></tr>`).join('')).join('')}</tbody></table></div>`)}
async function logsPage(){const rows=await api('/developer/api/storage-events');layout('Diagnostic Logs',`<div class="card"><p class="muted">Latest objects visible through the server-side private bucket integration. Raw audio and transcript content are not displayed here.</p>${rows.length?`<table class="table"><thead><tr><th>Object</th><th>Updated</th><th>Size</th></tr></thead><tbody>${rows.map(x=>`<tr><td><code>${esc(x.name)}</code></td><td>${esc(x.updated_at)}</td><td>${esc(x.metadata?.size||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No storage objects returned.</div>'}</div>`)}
async function docsPage(){const rows=await api('/developer/api/docs');layout('Documentation',`<div class="split"><div class="card list">${rows.map((x,i)=>`<button onclick="loadDoc(${JSON.stringify(x.name)})">${esc(x.title)}</button>`).join('')}</div><div class="card"><div id="doc"><div class="empty">Select a canonical document.</div></div></div></div>`)}
async function loadDoc(name){const d=await api('/developer/api/docs/'+encodeURIComponent(name));$('#doc').innerHTML=`<h3>${esc(d.name)}</h3><pre>${esc(d.content)}</pre>`}
async function roadmapPage(){const rows=await api('/developer/api/roadmap');layout('Next Phase',`<div class="card">${roadmapTable(rows)}</div>`)}
function roadmapTable(rows){if(!rows.length)return '<div class="empty">No roadmap items.</div>';return `<table class="table"><thead><tr><th>Priority</th><th>Phase</th><th>Work</th><th>Status</th><th>Owner</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.priority)}</td><td>${esc(x.phase)}</td><td><strong>${esc(x.title)}</strong><br><span class="muted">${esc(x.description)}</span></td><td>${esc(x.status)}</td><td>${esc(x.owner)}</td></tr>`).join('')}</tbody></table>`}
boot();
</script>
</body>
</html>
